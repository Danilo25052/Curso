<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="section-slider">
        <div class="slider">
          <img
            id="slide-1"
            src="./assets/slides/images/miles.png"
            alt="Miles Morales"
          />
          <img
            id="slide-2"
            src="./assets/slides/images/peter.png"
            alt="Peter Parker"
          />
          <img
            id="slide-3"
            src="./assets/slides/images/gwen.png"
            alt="Gwen Stacy"
          />

          />

        <div class="slider-navigation">
          <a href="#slide-1">
            <img
              src="./assets/slides/icons/icon-miles.png"

          </a>
          <a href="#slide-2">
            <img
              src="./assets/slides/icons/icon-peter.png"
              alt="Ícone Peter Parker"
            />
          </a>
          <a href="#slide-3">
            <img
              src="./assets/slides/icons/icon-gwen.png"
              alt="Ícone Gwen Stacy"
            />
          </a>
          <a href="#slide-4">
            <img src="./assets/slides/icons/icon-noir.png" alt="Ícone  Noir" />
          </a>
          <a href="#slide-5">
            <img
              src="./assets/slides/icons/icon-peni.png"
              alt="Ícone Peni Parker"
            />
          </a>
        </div>
      </section>
    </main>
