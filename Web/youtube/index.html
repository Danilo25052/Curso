<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <script src="./js/auxiliares.js"></script>
  <body>
    <header id="top-bar">
      <section id="section-menu-toggle">
        <button id="button-menu-toggle">
          <img
            src="./assets/svg/list.svg"
            alt="Botão Menu"
            onload="fetchSvg(self)"
          />
        </button>
        <a href="#" id="a-youtube-logo">
          <img
            src="./assets/svg/youtube-logo.svg"
            alt="Logo do YouTube"
            onload="fetchSvg(self)"
          />
        </a>
      </section>

      <section id="section-search">
        <div id="div-search-box">
          <div id="div-search-bar">
            <input type="text" />
            <button id="button-search">
              <img
                src="./assets/svg/search.svg"
                alt="Botão de Pesquisa"
                onload="fetchSvg(self)"
              />
            </button>
          </div>
          <button id="button-mic">
            <img
              src="./assets/svg/mic-fill.svg"
              alt="Botão de Microfone"
              onload="fetchSvg(self)"
            />
          </button>
        </div>
      </section>

      <section id="section-profile">
        <button id="button-create">
          <img
            src="./assets/svg/plus-lg.svg"
            alt="Botão Criar"
            onload="fetchSvg(self)"
          />
          <span>Criar</span>
        </button>
        <button>
          <img
            src="./assets/svg/bell.svg"
            alt="Botão de Notificações"
            onload="fetchSvg(self)"
          />
        </button>
        <button id="button-profile">
          <img src="" alt="Botão" onload="fetchSvg(self)" />
        </button>
      </section>
    </header>

    <main>
      <section id="side-menu">
        <section></section>
        <section></section>
        <section></section>
        <section></section>
        <section></section>
        <section></section>
      </section>

      <section id="section-videos-list">
        <section id="section-filters">
          <button></button>
          <button></button>
          <button></button>
          <button></button>
        </section>

        <section class="section-ads"></section>

        <section class="section-videos">
          <div class="div-video-card"></div>
          <div class="div-video-card"></div>
          <div class="div-video-card"></div>
          <div class="div-video-card"></div>
        </section>

        <section class="section-shorts">
          <div class="div-shorts-card"></div>
          <div class="div-shorts-card"></div>
          <div class="div-shorts-card"></div>
          <div class="div-shorts-card"></div>
        </section>

        <section class="section-videos">
          <div class="div-video-card"></div>
          <div class="div-video-card"></div>
          <div class="div-video-card"></div>
          <div class="div-video-card"></div>
        </section>
      </section>
    </main>
  </body>
</html>
